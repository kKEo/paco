# PaCo Cloud server (Laravel, server/): style and tests on SQLite, and on MariaDB
# (oldest supported 10.6 and current LTS 11.4) + Redis.
name: Server

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite
            database: sqlite
          - name: MariaDB 10.6
            database: mariadb
            mariadb: '10.6'
          - name: MariaDB 11.4
            database: mariadb
            mariadb: '11.4'
            redis: true
    services:
      mariadb:
        # The SQLite job starts one too (services cannot be conditional); unused there.
        image: mariadb:${{ matrix.mariadb || '11.4' }}
        env:
          MARIADB_DATABASE: paco_test
          MARIADB_USER: paco
          MARIADB_PASSWORD: paco
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, intl, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('server/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.database == 'mariadb' && 'paco_test' || ':memory:' }}
          DB_USERNAME: paco
          DB_PASSWORD: paco
          # tests/MariaDb run in the MariaDB jobs; tests/Redis (long-poll waker) in 11.4 only.
          PACO_TEST_REDIS: ${{ matrix.redis && '1' || '' }}
          REDIS_CLIENT: predis
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/pest
