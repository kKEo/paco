# Production overrides: `docker compose -f compose.yaml -f compose.prod.yaml up -d`
# on a small VPS. FrankenPHP's Caddy gets a certificate for PACO_DOMAIN and
# redirects HTTP to HTTPS. Put real secrets in .env (APP_KEY, DB_PASSWORD, MAIL_*).
# Back up the bundled MariaDB nightly, e.g.
#   docker compose exec db sh -c 'mariadb-dump -u"$MARIADB_USER" -p"$MARIADB_PASSWORD" --single-transaction "$MARIADB_DATABASE"' > paco.sql
# With an external MariaDB server (no COMPOSE_PROFILES=mariadb in .env), back it up there.

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${PACO_DOMAIN}
  DB_CONNECTION: mariadb
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-paco}
  DB_USERNAME: ${DB_USERNAME:-paco}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "true"
  REDIS_HOST: redis
  # Wake held device polls the moment an event commits.
  PACO_LONGPOLL_WAITER: redis
  MAIL_MAILER: ${MAIL_MAILER:-smtp}

services:
  app:
    environment:
      <<: *env
      PACO_MIGRATE: "1"
    command: ["sh", "-c", "exec php artisan octane:frankenphp --host=${PACO_DOMAIN} --port=443 --https --http-redirect --workers=${OCTANE_WORKERS:-32} --max-requests=${OCTANE_MAX_REQUESTS:-1000}"]
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_started

  queue:
    environment: *env
  scheduler:
    environment: *env

  db:
    environment:
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  mailpit: !reset null

volumes:
  caddy_data:
  caddy_config:
  redisdata:
