# Local development stack: `make server-up` from the repository root, then
# http://localhost:8080. Mail lands in Mailpit at http://localhost:8025.
#
# For a Mac daemon on the same machine, set PACO_CLOUD_URL=http://localhost:8080
# (Debug builds only; see server/README.md).
#
# Database: the bundled MariaDB (`db`) runs under the profile `mariadb`, which
# .env enables with COMPOSE_PROFILES=mariadb (`make server-up` passes it too).
# For an existing MariaDB 10.6+ server, drop that line and set DB_HOST, DB_PORT,
# DB_DATABASE, DB_USERNAME and DB_PASSWORD in .env.

x-env: &env
  APP_ENV: local
  DB_CONNECTION: mariadb
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-paco}
  DB_USERNAME: ${DB_USERNAME:-paco}
  DB_PASSWORD: ${DB_PASSWORD:-paco}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025

x-app: &app
  build:
    context: .
    target: app
  image: paco-cloud:dev
  env_file: .env
  environment: *env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
      required: false # absent when using an external MariaDB

services:
  app:
    <<: *app
    environment:
      <<: *env
      PACO_MIGRATE: "1"
    ports:
      - "8080:8080"
    # The web container runs the migrations; workers start once it is up.
    healthcheck:
      test: ["CMD", "php", "artisan", "migrate:status", "--no-ansi"]
      interval: 5s
      retries: 30

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mariadb:11.4
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-paco}
      MARIADB_USER: ${DB_USERNAME:-paco}
      MARIADB_PASSWORD: ${DB_PASSWORD:-paco}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

volumes:
  mariadbdata:
