<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="t d">
<title id="t">Parent Access checks the PIN on your Mac</title>
<desc id="d">The PIN typed on the child's Mac is sent encrypted to your Mac, which checks it and counts wrong attempts.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#DCFCE7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#16A34A" stroke-width="3"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="759" height="259" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="32" y="34" width="210" height="150" rx="14" fill="#0F172A" opacity="0.08"/>
<rect x="30" y="30" width="210" height="150" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="135" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Enter Parent PIN</text>
<rect x="60" y="74" width="150" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<circle cx="80" cy="89" r="4.5" fill="#0F172A"/>
<circle cx="102" cy="89" r="4.5" fill="#0F172A"/>
<circle cx="124" cy="89" r="4.5" fill="#0F172A"/>
<circle cx="146" cy="89" r="4.5" fill="#0F172A"/>
<circle cx="168" cy="89" r="4.5" fill="#0F172A"/>
<circle cx="190" cy="89" r="4.5" fill="#0F172A"/>
<rect x="95" y="120" width="80" height="26" rx="6" fill="#2563EB"/>
<text x="135.0" y="137.32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Unlock</text>
<text x="135" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Child's Mac</text>
<text x="135" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">The PIN is never stored here</text>
<line x1="262" y1="90" x2="528" y2="90" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-orange)"/>
<text x="395" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#EA580C" text-anchor="middle">PIN, encrypted</text>
<line x1="528" y1="130" x2="262" y2="130" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-green)"/>
<text x="395" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#16A34A" text-anchor="middle">correct / wrong / locked out</text>
<circle cx="395" cy="109.0" r="11.5" fill="#FFFFFF"/>
<path d="M391.0,107.0 V103.5 A4.0,4.0 0 0 1 399.0,103.5 V107.0" stroke="#334155" stroke-width="1.6" fill="none"/>
<rect x="389.0" y="106.8" width="12.0" height="9.0" rx="1.2" fill="#334155"/>
<rect x="555" y="52" width="150" height="93.0" rx="7.5" fill="#334155"/>
<rect x="562.5" y="59.5" width="135.0" height="79.5" rx="3.0" fill="#DBEAFE"/>
<path d="M540.0,147.0 L720.0,147.0 L712.5,155.5 L547.5,155.5 Z" fill="#334155"/>
<circle cx="630" cy="98" r="17" fill="#16A34A"/>
<path d="M622.35,98 L628.3,104.46 L638.5,92.05" stroke="#fff" stroke-width="4.760000000000001" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="630" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Your Mac</text>
<text x="630" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">Checks the PIN, counts wrong attempts</text>
</svg>
