<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
<title id="t">Overnight schedules belong to the day they start</title>
<desc id="d">A Thursday 21:00 to 07:00 schedule blocks until Friday 07:00 but not Friday evening; a daytime schedule blocks the selected day only.</desc>
