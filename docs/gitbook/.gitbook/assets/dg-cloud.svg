<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="t d">
<title id="t">PaCo Cloud</title>
<desc id="d">The parent uses a browser. The PaCo Cloud server keeps the rules, requests and screen time. On the child's Mac the root daemon talks to the server over HTTPS: a long-poll brings commands, heartbeats, usage and requests go up; a pf pass rule keeps the server reachable while internet is off.</desc>
