<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="t d">
<title id="t">Only the app in front is counted</title>
<desc id="d">Over ten minutes, each app accrues time only while it is frontmost; background helpers are not counted.</desc>
