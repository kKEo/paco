<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="t d">
<title id="t">PaCo architecture</title>
<desc id="d">On each Mac the app and agent run in the user session and talk to the root daemon over XPC; the daemon owns policy.json and the pf anchor; the two apps talk over Bonjour with TLS-PSK.</desc>
