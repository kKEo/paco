<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
<title id="t">Why the pass rules must be quick</title>
<desc id="d">pf evaluates every rule and the last match wins unless a matching rule is quick.</desc>
<defs>
<marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F172A"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
<marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#DCFCE7"/><line x1="0" y1="0" x2="0" y2="8" stroke="#16A34A" stroke-width="3"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="759" height="379" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
<rect x="20" y="20" width="345" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="38" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">Without quick</text>
<text x="38" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">last match wins</text>
<rect x="38" y="80" width="210" height="24" rx="12.0" fill="#FFFFFF"/>
<text x="143.0" y="95.96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">packet → 192.168.1.20 (printer)</text>
<rect x="38" y="118" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="138" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">pass out to 10.0.0.0/8</text>
<text x="284" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="start">no match</text>
<rect x="38" y="158" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
<text x="48" y="178" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">pass out to 192.168.0.0/16</text>
<text x="284" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#16A34A" text-anchor="start">match</text>
<rect x="38" y="198" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="48" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">pass out to 224.0.0.0/4 …</text>
<text x="284" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="start">no match</text>
<rect x="38" y="238" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
<text x="48" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">block drop out … any to any</text>
<text x="284" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#DC2626" text-anchor="start">match</text>
<path d="M28,132 L28,253" stroke="#DC2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/>
<rect x="38" y="280" width="310" height="30" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="193.0" y="299.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#DC2626" text-anchor="middle">BLOCKED — the block rule matched last</text>
<rect x="395" y="20" width="345" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="413" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start">With quick (PaCo)</text>
<text x="413" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">first quick match wins</text>
<rect x="413" y="80" width="210" height="24" rx="12.0" fill="#FFFFFF"/>
<text x="518.0" y="95.96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#0F172A" text-anchor="middle">packet → 192.168.1.20 (printer)</text>
<rect x="413" y="118" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="423" y="138" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">pass out quick to 10.0.0.0/8</text>
<text x="659" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="start">no match</text>
<rect x="413" y="158" width="238" height="30" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
<text x="423" y="178" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start">pass out quick to 192.168.0.0/16</text>
<text x="659" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#16A34A" text-anchor="start">match</text>
<rect x="413" y="198" width="238" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="423" y="218" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">pass out quick to 224.0.0.0/4 …</text>
<text x="659" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="start">not evaluated</text>
<rect x="413" y="238" width="238" height="30" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
<text x="423" y="258" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="start">block drop out … any to any</text>
<text x="659" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="start">not evaluated</text>
<path d="M403,132 L403,173" stroke="#16A34A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/>
<rect x="413" y="280" width="310" height="30" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="568.0" y="299.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#16A34A" text-anchor="middle">PASS — stops at the quick match</text>
<text x="380" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="middle">Internet traffic matches no pass rule, so it reaches the block rule in both cases.</text>
</svg>
